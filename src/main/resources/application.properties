spring.application.name=travel-planner

# Local PostgreSQL defaults; override these with environment variables as needed.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/travel_planner}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Apply versioned database changes before validating the JPA model.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Session cookie settings. Set SESSION_COOKIE_SECURE=true behind HTTPS in deployment.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Use console mode locally; configure SMTP credentials and EMAIL_MODE=smtp for real delivery.
app.email.delivery-mode=${EMAIL_MODE:console}
app.email.from=${MAIL_FROM:no-reply@wayfarer.local}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
